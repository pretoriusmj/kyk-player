<!doctype html>
<!-- Kyk phone remote. Opened from the QR code on the TV (#k=<pairing secret>); talks to Kyk through
     two private ntfy.sh topics derived from that secret. Works on iPhone and Android, Wi-Fi or mobile data. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kyk">
<link rel="manifest" href="remote.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Kyk Remote</title>
<style>
:root { --bg: #08090c; --panel: #15181e; --panel2: #1d2129; --line: rgba(255,255,255,.08); --text: #f3f4f6; --muted: #a3a9b3; --dim: #646b76; --accent: #ff7a45; --kids: #3fd6c6;
  --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px); }
body.kids { --accent: #3fd6c6; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
[hidden] { display: none !important; }
svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: calc(var(--top) + 12px) 18px 12px; display: flex; align-items: center; background: linear-gradient(var(--bg) 70%, rgba(8,9,12,0)); }
.brand { font-size: 26px; font-weight: 800; letter-spacing: -.04em; }
.brand b { color: var(--accent); }
.pill { margin-left: auto; display: flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 99px; background: var(--panel); font-size: 13px; font-weight: 600; color: var(--muted); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 8px; }
.pill.ok i { background: #4fd18b; box-shadow: 0 0 8px #4fd18b; }
.pill.bad i { background: #ff5a64; }

main { padding: calc(var(--top) + 64px) 16px calc(var(--bot) + 92px); }
section { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
h3 { margin: 22px 4px 10px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

/* search */
form { position: sticky; top: calc(var(--top) + 58px); z-index: 4; display: flex; align-items: center; height: 64px; padding: 0 8px 0 18px; border-radius: 18px; background: var(--panel); }
form svg { color: var(--muted); width: 26px; height: 26px; }
form input { flex: 1; min-width: 0; height: 100%; margin-left: 12px; border: 0; outline: 0; background: none; color: var(--text); font-family: inherit; font-size: 21px; font-weight: 600; -webkit-appearance: none; appearance: none; }
form input::placeholder { color: var(--dim); font-weight: 500; }
form button { height: 48px; padding: 0 20px; border-radius: 14px; font-size: 17px; background: var(--accent); color: #0b0c0f; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; margin: 0 -4px; }
.chip { margin: 4px; height: 36px; padding: 0 14px; border-radius: 99px; background: var(--panel); color: var(--muted); font-size: 14px; font-weight: 600; }
.note { margin: 16px 4px; color: var(--muted); font-size: 14px; }
.res { display: flex; align-items: center; width: 100%; padding: 8px; margin-top: 6px; border-radius: 14px; text-align: left; transition: background .15s; }
.res:active { background: var(--panel); }
.res .th { position: relative; width: 132px; height: 74px; border-radius: 10px; overflow: hidden; background: var(--panel); flex: none; }
.res .th img { width: 100%; height: 100%; object-fit: cover; }
.res .th span { position: absolute; right: 5px; bottom: 5px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.8); font-size: 11px; font-weight: 700; }
.res .tx { margin-left: 12px; min-width: 0; }
.res .tx b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 15px; font-weight: 650; line-height: 1.3; }
.res .tx small { display: block; margin-top: 4px; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.res.playing { background: var(--panel2); box-shadow: inset 0 0 0 2px var(--accent); }
.spin { width: 22px; height: 22px; border: 3px solid var(--panel2); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; margin: 30px auto; }
@keyframes rot { to { transform: rotate(360deg); } }

/* remote */
.np { display: flex; align-items: center; padding: 12px; border-radius: 18px; background: var(--panel); }
.np img { width: 96px; height: 54px; border-radius: 8px; object-fit: cover; background: var(--panel2); flex: none; }
.np .tx { margin-left: 12px; min-width: 0; flex: 1; }
.np b { display: block; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np small { display: block; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 4px; margin-top: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }
.np.idle { color: var(--dim); justify-content: center; height: 78px; font-size: 14px; }
.transport { display: flex; justify-content: center; align-items: center; margin: 18px 0 6px; }
.tb { width: 64px; height: 64px; border-radius: 50%; background: var(--panel); display: flex; align-items: center; justify-content: center; margin: 0 10px; flex-direction: column; font-size: 11px; font-weight: 700; color: var(--muted); }
.tb.big { width: 78px; height: 78px; background: var(--accent); color: #0b0c0f; }
.tb.big svg { width: 32px; height: 32px; }
.tb:active, .dk:active, .sk:active { transform: scale(.94); }
.pad { position: relative; width: 272px; height: 272px; margin: 22px auto 10px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #20242c, #14171c); box-shadow: inset 0 0 0 1px var(--line), 0 20px 50px rgba(0,0,0,.5); }
.dk { position: absolute; width: 92px; height: 92px; display: flex; align-items: center; justify-content: center; color: var(--muted); border-radius: 50%; }
.dk svg { width: 34px; height: 34px; }
.dk.u { top: 0; left: 90px; } .dk.d { bottom: 0; left: 90px; } .dk.l { left: 0; top: 90px; } .dk.r { right: 0; top: 90px; }
.dk.ok { top: 76px; left: 76px; width: 120px; height: 120px; background: var(--panel2); color: var(--text); font-weight: 800; font-size: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.5); }
.keys { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.sk { display: flex; align-items: center; height: 46px; padding: 0 16px; margin: 5px; border-radius: 14px; background: var(--panel); font-size: 14px; font-weight: 650; }
.sk svg { width: 20px; height: 20px; margin-right: 7px; color: var(--muted); }
.sk.y svg { color: #f7d25a; }

/* volume */
.vol { display: flex; align-items: center; margin: 16px 0 0; padding: 8px; border-radius: 18px; background: var(--panel); }
.vb { width: 52px; height: 52px; border-radius: 14px; background: var(--panel2); display: flex; align-items: center; justify-content: center; flex: none; }
.vb + .vb, .vlev + .vb { margin-left: 8px; }
.vb:active { transform: scale(.94); }
.vb.on { background: #ff5a64; color: #0b0c0f; }
.vlev { position: relative; flex: 1; height: 52px; margin-left: 8px; border-radius: 14px; background: var(--panel2); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.vlev i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(255,122,69,.35); transition: width .2s; }
body.kids .vlev i { background: rgba(63,214,198,.35); }
.vlev span { position: relative; font-weight: 700; font-size: 15px; }

/* profile sheet */
.sheet { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 8; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; }
.sheet-box { width: 100%; padding: 22px 18px calc(var(--bot) + 18px); border-radius: 24px 24px 0 0; background: #15181e; animation: up .25s ease; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { margin: 0 4px 14px; font-size: 19px; }
.prof { display: flex; align-items: center; width: 100%; padding: 12px; margin-top: 8px; border-radius: 16px; background: var(--panel2); text-align: left; }
.prof i { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; color: #0b0c0f; margin-right: 14px; flex: none; }
.prof b { display: block; font-size: 17px; } .prof small { color: var(--muted); font-size: 13px; }
.prof.on { box-shadow: inset 0 0 0 2px var(--accent); }
.pinrow { display: flex; margin-top: 14px; }
.pinrow input { flex: 1; min-width: 0; height: 54px; padding: 0 16px; border-radius: 14px; border: 0; outline: 0; background: var(--panel2); color: var(--text); font-size: 24px; letter-spacing: .4em; font-family: inherit; }
.pinrow button { margin-left: 8px; padding: 0 20px; border-radius: 14px; background: var(--accent); color: #0b0c0f; font-weight: 700; }
.sheet-x { display: block; width: 100%; height: 50px; margin-top: 12px; border-radius: 14px; color: var(--muted); font-weight: 650; }
.ver { margin: 24px 4px 0; color: var(--dim); font-size: 12px; }

/* apps */
.apps { display: flex; flex-wrap: wrap; margin: 0 -6px; }
.app { width: calc(50% - 12px); margin: 6px; height: 84px; padding: 0 14px; border-radius: 18px; background: var(--panel); display: flex; align-items: center; font-weight: 700; font-size: 15px; text-align: left; }
.app i { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-right: 12px; font-style: normal; font-weight: 800; color: #0b0c0f; flex: none; }

/* pairing / unpaired */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty svg { width: 64px; height: 64px; color: var(--accent); }
.empty h2 { color: var(--text); margin: 18px 0 8px; font-size: 22px; }
.empty b { color: var(--text); }

nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; padding: 8px 10px calc(var(--bot) + 8px); background: rgba(12,13,17,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
nav button { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 0; color: var(--dim); font-size: 12px; font-weight: 650; border-radius: 12px; }
nav button svg { width: 26px; height: 26px; margin-bottom: 3px; }
nav button.on { color: var(--accent); }
#toast { position: fixed; left: 50%; bottom: calc(var(--bot) + 96px); transform: translateX(-50%); z-index: 9; max-width: calc(100% - 40px); padding: 12px 18px; border-radius: 14px; background: #fff; color: #0b0c0f; font-weight: 650; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.4); text-align: center; }
</style>
</head>
<body>
<header><div class="brand">ky<b>k</b></div><button class="pill" id="pill"><i></i><span id="pillTxt">Connecting…</span></button></header>
<div class="sheet" id="sheet" hidden><div class="sheet-box">
  <h2>Who’s watching on the TV?</h2>
  <button class="prof" data-prof="adult"><i style="background:#ff7a45">G</i><span><b>Grown-ups</b><small>Everything, with your filters</small></span></button>
  <button class="prof" data-prof="kids"><i style="background:#3fd6c6">K</i><span><b>Kids</b><small>Approved channels only</small></span></button>
  <div class="pinrow" id="pinRow" hidden><input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="PIN" autocomplete="off"><button id="pinGo">Switch</button></div>
  <button class="sheet-x" id="sheetX">Cancel</button>
</div></div>
<main>
  <section id="unpaired" hidden>
    <div class="empty"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8"/></svg>
      <h2>Pair with your TV</h2><p>Open <b>Kyk</b> on the TV and press the <b>green</b> button (or Settings → Phone remote), then scan the code with your camera.</p></div>
  </section>
  <section id="tab-search" hidden>
    <form id="sForm" autocomplete="off"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="sQ" type="search" enterkeyhint="search" placeholder="Search YouTube on the TV" autocapitalize="off" autocorrect="on"><button type="submit">Go</button></form>
    <div id="sRecent"></div>
    <div id="sOut"></div>
  </section>
  <section id="tab-remote" hidden>
    <div class="np idle" id="np">Nothing playing</div>
    <div class="transport">
      <button class="tb" data-k="rw"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>−10</button>
      <button class="tb big" data-k="playpause"><svg class="i" viewBox="0 0 24 24"><path d="M7 5v14l11-7z" fill="currentColor"/></svg></button>
      <button class="tb" data-k="ff"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg>+30</button>
    </div>
    <div class="vol">
      <button class="vb" data-vol="mute" id="vMute"><svg class="i" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="m16 9.5 5 5m0-5-5 5"/></svg></button>
      <button class="vb" data-vol="down"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      <div class="vlev"><i id="vBar"></i><span id="vTxt">Volume</span></div>
      <button class="vb" data-vol="up"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    </div>
    <div class="pad">
      <button class="dk u" data-k="up"><svg class="i" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      <button class="dk l" data-k="left"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="dk ok" data-k="ok">OK</button>
      <button class="dk r" data-k="right"><svg class="i" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
      <button class="dk d" data-k="down"><svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <div class="keys">
      <button class="sk" data-k="back"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Back</button>
      <button class="sk" data-cmd="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>Home</button>
      <button class="sk y" data-k="yellow"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Watch later</button>
      <button class="sk" data-k="chup"><svg class="i" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>Row / next</button>
    </div>
  </section>
  <section id="tab-apps" hidden>
    <h3>Open on the TV</h3>
    <div class="apps" id="apps"><div class="spin"></div></div>
    <p class="note">Opens the app from Kyk. Controls inside other apps need the TV’s own remote for now.</p>
    <p class="ver" id="ver"></p>
  </section>
</main>
<nav id="nav" hidden>
  <button data-tab="search"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>Search</button>
  <button data-tab="remote"><svg class="i" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="3"/><circle cx="12" cy="9" r="2"/><path d="M10 15h4"/></svg>Remote</button>
  <button data-tab="apps"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Apps</button>
</nav>
<div id="toast" hidden></div>
<script>
(function () {
  'use strict';
  var NTFY = 'https://ntfy.sh';
  var VERSION = 4;   // bump with every change: open copies notice and reload themselves
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ls = { get: function (k, d) { try { var v = localStorage.getItem('kyk.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set: function (k, v) { try { localStorage.setItem('kyk.' + k, JSON.stringify(v)); } catch (e) {} } };

  // ---- pairing: the secret arrives in the QR link's #k=…, then lives only in this phone's storage ----
  // The secret stays in the link itself (#k=…): a home-screen shortcut saves the link, and on iPhone
  // home-screen apps don't share storage with Safari, so the link is what keeps you paired.
  var m = /[#&]k=([A-Za-z0-9]{16,40})/.exec(location.hash);
  if (m) ls.set('secret', m[1]);
  var secret = m ? m[1] : ls.get('secret', null);
  if (!secret) { $('#unpaired').hidden = false; $('#pill').classList.add('bad'); $('#pillTxt').textContent = 'Not paired'; return; }
  if (!m) history.replaceState(null, '', location.pathname + '#k=' + secret);
  // A manifest whose start_url carries the secret, so Android's "Add to Home screen"/install keeps it too.
  var base = location.href.replace(/[#?].*$/, '').replace(/[^\/]*$/, '');
  var man = { name: 'Kyk Remote', short_name: 'Kyk', start_url: base + 'remote.html#k=' + secret, scope: base, display: 'standalone', orientation: 'portrait',
    background_color: '#08090c', theme_color: '#08090c', icons: [{ src: base + 'icon-192.png', sizes: '192x192', type: 'image/png' }, { src: base + 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
  var ml = document.querySelector('link[rel=manifest]');
  ml.setAttribute('href', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)));
  $('#nav').hidden = false;

  var tvTopic = NTFY + '/kyk-' + secret + '-tv', phTopic = NTFY + '/kyk-' + secret + '-ph';
  var connected = false, helloTimer = 0, np = null, profile = '', kids = false, lastQ = '', results = [], pinNeeded = false;

  function send(msg) {
    if (navigator.vibrate) navigator.vibrate(10);
    return fetch(tvTopic + '?cache=no&firebase=no', { method: 'POST', body: JSON.stringify(msg) }).then(function (r) {
      if (r.status === 429) toast('Too many presses for a moment — try again in a few seconds');
    }).catch(function () { status(false, 'Offline'); });
  }
  function status(ok, text) { connected = ok; $('#pill').className = 'pill ' + (ok ? 'ok' : 'bad'); $('#pillTxt').textContent = text; }
  var toastTimer = 0;
  function toast(t) { var el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 2600); }

  // ---- messages from the TV ----
  function hello() {
    send({ t: 'hello' });
    clearTimeout(helloTimer);
    helloTimer = setTimeout(function () { if (!connected) status(false, 'TV not answering — open Kyk'); }, 5000);
  }
  var es = new EventSource(phTopic + '/sse');
  es.onopen = hello;
  es.onmessage = function (ev) {
    var env, msg;
    try { env = JSON.parse(ev.data); if (env.event !== 'message') return; msg = JSON.parse(env.message); } catch (e) { return; }
    if (msg.t === 'hi') {
      profile = msg.profileName || ''; kids = !!msg.kids; pinNeeded = !!msg.pin;
      document.body.classList.toggle('kids', kids);
      status(true, (profile ? 'TV · ' + profile : 'TV · pick a profile') + ' ▾');
      $('#sQ').placeholder = kids ? 'Search the kids’ channels' : 'Search YouTube on the TV';
      setNp(msg.np);
      if (msg.vol) setVol(msg.vol);
    } else if (msg.t === 'results') { showResults(msg); }
    else if (msg.t === 'np') { setNp(msg.np); }
    else if (msg.t === 'apps') { showApps(msg.items || []); }
    else if (msg.t === 'say') { toast(msg.text); }
    else if (msg.t === 'vol') { setVol(msg); }
  };
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { hello(); checkUpdate(); } });

  // ---- self-update: a home-screen app on iPhone keeps an old copy, so look for a newer one ----
  $('#ver').textContent = 'Kyk Remote v' + VERSION;
  function checkUpdate() {
    fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
      var mm = /var VERSION = (\d+)/.exec(html);
      if (mm && +mm[1] > VERSION) location.reload();
    }).catch(function () {});
  }
  setTimeout(checkUpdate, 3000);

  // ---- switching the TV's profile ----
  var wantProf = null;
  $('#pill').addEventListener('click', function () {
    if (!connected) { hello(); return; }
    wantProf = null; $('#pinRow').hidden = true; $('#pinIn').value = '';
    Array.prototype.forEach.call(document.querySelectorAll('.prof'), function (b) { b.classList.toggle('on', b.getAttribute('data-prof') === (kids ? 'kids' : 'adult')); });
    $('#sheet').hidden = false;
  });
  $('#sheetX').addEventListener('click', function () { $('#sheet').hidden = true; });
  $('#sheet').addEventListener('click', function (e) {
    var b = e.target.closest('[data-prof]'); if (!b) return;
    wantProf = b.getAttribute('data-prof');
    if (wantProf === 'adult' && pinNeeded) { $('#pinRow').hidden = false; $('#pinIn').focus(); return; }
    send({ t: 'profile', id: wantProf }); $('#sheet').hidden = true;
  });
  $('#pinGo').addEventListener('click', function () { send({ t: 'profile', id: 'adult', pin: $('#pinIn').value }); $('#sheet').hidden = true; });
  $('#pinIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#pinGo').click(); });

  // ---- tabs ----
  function tab(name) {
    ['search', 'remote', 'apps'].forEach(function (t) { $('#tab-' + t).hidden = t !== name; });
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === name); });
    ls.set('tab', name);
    if (name === 'apps') send({ t: 'apps' });
  }
  $('#nav').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) tab(b.getAttribute('data-tab')); });
  tab(ls.get('tab', 'search'));

  // ---- search ----
  function recent() { return ls.get('recent', []); }
  function paintRecent() {
    var r = recent();
    $('#sRecent').innerHTML = r.length && !results.length ? '<h3>Recent</h3><div class="chips">' + r.map(function (q) { return '<button class="chip" data-q="' + esc(q) + '">' + esc(q) + '</button>'; }).join('') + '</div>' : '';
  }
  function search(q) {
    q = q.trim(); if (!q) return;
    lastQ = q; results = [];
    $('#sQ').value = q; $('#sQ').blur();
    $('#sOut').innerHTML = '<div class="spin"></div><p class="note" style="text-align:center">Searching on the TV…</p>';
    paintRecent();
    send({ t: 'search', q: q });
    var r = recent().filter(function (x) { return x.toLowerCase() !== q.toLowerCase(); }); r.unshift(q); ls.set('recent', r.slice(0, 10));
  }
  $('#sForm').addEventListener('submit', function (e) { e.preventDefault(); search($('#sQ').value); });
  $('#sRecent').addEventListener('click', function (e) { var b = e.target.closest('[data-q]'); if (b) search(b.getAttribute('data-q')); });
  var dur = function (s) { if (!s) return ''; var h = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + (mm < 10 ? '0' : '') : '') + mm + ':' + (ss < 10 ? '0' : '') + ss; };
  function showResults(msg) {
    if (msg.q !== lastQ && lastQ) return;
    results = msg.items || [];
    if (msg.error) { $('#sOut').innerHTML = '<p class="note">Search failed: ' + esc(msg.error) + '</p>'; return; }
    $('#sOut').innerHTML = results.length ? '<h3>' + results.length + ' on the TV' + (msg.kids ? ' · kids’ channels' : '') + '</h3>' + results.map(function (v) {
      return '<button class="res" data-id="' + esc(v.id) + '"><span class="th"><img loading="lazy" src="https://i.ytimg.com/vi/' + esc(v.id) + '/mqdefault.jpg" alt="">' + (v.d ? '<span>' + dur(v.d) + '</span>' : '') + '</span>' +
        '<span class="tx"><b>' + esc(v.t) + '</b><small>' + esc(v.c) + '</small></span></button>';
    }).join('') : '<p class="note">Nothing found' + (msg.kids ? ' on the kids’ channels' : '') + '.</p>';
    paintRecent();
  }
  $('#sOut').addEventListener('click', function (e) {
    var b = e.target.closest('[data-id]'); if (!b) return;
    Array.prototype.forEach.call(document.querySelectorAll('.res'), function (x) { x.classList.toggle('playing', x === b); });
    send({ t: 'play', id: b.getAttribute('data-id') });
    toast('Playing on the TV');
    setTimeout(function () { tab('remote'); }, 700);
  });
  paintRecent();

  // ---- remote ----
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-k],[data-cmd]'); if (!b || b.closest('nav')) return;
    if (b.hasAttribute('data-cmd')) send({ t: b.getAttribute('data-cmd') }); else send({ t: 'key', k: b.getAttribute('data-k') });
  });
  var npTimer = 0;
  function setNp(n) {
    np = n;
    clearInterval(npTimer);
    var el = $('#np');
    // The big button shows what pressing it will do.
    $('.tb.big').innerHTML = n && (n.state === 1 || n.state === 3)
      ? '<svg class="i" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor" stroke="none"/></svg>'
      : '<svg class="i" viewBox="0 0 24 24"><path d="M7 5v14l11-7z" fill="currentColor"/></svg>';
    if (!n) { el.className = 'np idle'; el.innerHTML = 'Nothing playing'; return; }
    el.className = 'np';
    el.innerHTML = '<img src="https://i.ytimg.com/vi/' + esc(n.id) + '/mqdefault.jpg" alt=""><div class="tx"><b>' + esc(n.t) + '</b><small>' + esc(n.c) + ' · ' + (n.state === 1 ? 'playing' : n.state === 2 ? 'paused' : n.state === 0 ? 'ended' : 'starting') + '</small><div class="bar"><i id="npBar"></i></div></div>';
    var paint = function () { var p = n.pos + (n.state === 1 ? (Date.now() - n.at) / 1000 : 0); $('#npBar').style.width = (n.dur ? Math.min(100, p / n.dur * 100) : 0) + '%'; };
    paint(); npTimer = setInterval(paint, 1000);
  }

  // ---- volume (the TV's own) ----
  function setVol(v) {
    if (v.level == null) { $('#vTxt').textContent = 'Volume'; return; }
    $('#vBar').style.width = Math.min(100, v.level) + '%';
    $('#vTxt').textContent = v.mute ? 'Muted' : 'Volume ' + v.level;
    $('#vMute').classList.toggle('on', !!v.mute);
  }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-vol]'); if (b) send({ t: 'vol', d: b.getAttribute('data-vol') }); });

  // ---- apps ----
  var COLORS = ['#ff7a45', '#3fd6c6', '#7cc4ff', '#b49cff', '#a8d672', '#ff6f91', '#f7d25a'];
  function showApps(items) {
    $('#apps').innerHTML = items.length ? items.map(function (a, i) {
      return '<button class="app" data-app="' + esc(a.id) + '"><i style="background:' + COLORS[i % COLORS.length] + '">' + esc(a.name.charAt(0)) + '</i>' + esc(a.name) + '</button>';
    }).join('') : '<p class="note">No apps reported — is Kyk open on the TV?</p>';
  }
  $('#apps').addEventListener('click', function (e) { var b = e.target.closest('[data-app]'); if (b) { send({ t: 'launch', id: b.getAttribute('data-app') }); toast('Opening on the TV…'); } });
})();
</script>
</body>
</html>
